<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizza Shop</title>
    <link rel="stylesheet" href="pizza.css">
</head>
<body>

    <div class="screen">

        <div class="heading">The Pizza Shop</div>

        <div class="tagline">
            Taste the most awesome pizza delivered at your home.
        </div>

        <div class="card">

            <img class="img2" src="./pizza3.jpg" alt="pizza-image">

            <div class="cta">
                <div class="price">Rs 85/-</div>
                <div class="orderNow">Order Now</div>
            </div>

            <div class="status">

                <div class="statusLabel">
                    Order Status
                </div>

                <div class="statusValue">
                    ⏳ Waiting...
                </div>

            </div> 

        </div>

    </div>

    <script src="./pizza.js"></script>

</body>
</html>

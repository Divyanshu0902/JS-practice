<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Post Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         HEADER
    ========================== -->

    <header class="header">

        <div class="header-container">

            <div class="logo">
                PostHub
            </div>

            <nav class="navbar">
                <a href="#">Home</a>
                <a href="#">About</a>
                <a href="#">Contents</a>
                <a href="#">Contact</a>
            </nav>

            <button class="subscribe">
                Subscribe
            </button>

        </div>

    </header>


    <!-- =========================
         MAIN
    ========================== -->

    <main class="main">

        <!-- Sidebar -->

        <aside class="aside">

            <h2>Categories</h2>

            <a href="#">All Posts</a>
            <a href="#">Technology</a>
            <a href="#">Science</a>
            <a href="#">Business</a>
            <a href="#">Sports</a>

        </aside>


        <!-- API-generated posts -->

        <section class="section">

            <!--
                JavaScript will generate
                post cards here.
            -->

        </section>


        <!-- Footer -->

        <footer class="footer">

            <p>
                © 2026 PostHub. All rights reserved.
            </p>

        </footer>

    </main>

    <script src="script.js"></script>

</html>
